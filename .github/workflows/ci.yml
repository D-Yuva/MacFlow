name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  RUST_BACKTRACE: "1"

jobs:
  cargo-matrix:
    name: ${{ matrix.mode }} features
    runs-on: macos-15
    timeout-minutes: 35
    env:
      # Override rust-toolchain.toml so this matrix really exercises latest stable.
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            feature_args: ""
          - mode: all
            feature_args: --all-features
          - mode: no-default
            feature_args: --no-default-features

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          toolchain: stable

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macflow-${{ matrix.mode }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked ${{ matrix.feature_args }}

      - name: Test all targets
        run: cargo test --all-targets --locked ${{ matrix.feature_args }}

      - name: Lint all targets
        run: cargo clippy --all-targets --locked ${{ matrix.feature_args }} -- -D warnings

  msrv:
    name: Rust 1.88 minimum version
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install declared minimum Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv-1.88

      - name: Check all targets at MSRV
        run: cargo check --all-targets --locked

  universal-bundle:
    name: Universal macOS bundle
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          # build.sh follows rust-toolchain.toml, so install both targets there.
          toolchain: 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: universal-release

      - name: Build and verify both architectures
        env:
          MACFLOW_BUILD_ARCHS: universal
        run: ./build.sh

      - name: Verify universal slices
        run: |
          archs=$(lipo -archs build/MacFlow.app/Contents/MacOS/MacFlow)
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
