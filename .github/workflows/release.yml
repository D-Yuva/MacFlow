name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the app version (for example, v1.4.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  RUST_BACKTRACE: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  package:
    name: Verify, sign, and notarize
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      archive: ${{ steps.release.outputs.archive }}
      checksum: ${{ steps.release.outputs.checksum }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain and macOS targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          # Match rust-toolchain.toml for reproducible release builds.
          toolchain: 1.88.0

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate release tag and source commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3: $RELEASE_TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag $RELEASE_TAG does not exist in the repository." >&2
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          source_commit=$(git rev-parse HEAD)
          if [[ "$tag_commit" != "$source_commit" ]]; then
            echo "Existing tag $RELEASE_TAG does not point to this workflow commit." >&2
            exit 1
          fi
          source_version=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [[ "v$source_version" != "$RELEASE_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match source version v$source_version." >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required release secret is missing: $value" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/macflow-release.p12"
          keychain_path="$RUNNER_TEMP/macflow-signing.keychain-db"
          cleanup_failed_import() {
            import_status=$?
            trap - EXIT
            rm -f "$certificate_path"
            if [[ $import_status -ne 0 ]]; then
              security delete-keychain "$keychain_path" 2>/dev/null || true
            fi
            exit "$import_status"
          }
          trap cleanup_failed_import EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$certificate_path"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -1)
          if [[ -z "$identity" ]]; then
            echo "The imported archive has no Developer ID Application identity." >&2
            exit 1
          fi
          trap - EXIT
          {
            echo "MACFLOW_SIGN_IDENTITY=$identity"
            echo "MACFLOW_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Run full universal verification
        env:
          MACFLOW_BUILD_ARCHS: universal
        run: ./scripts/verify.sh

      - name: Validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build/MacFlow.app/Contents/Info.plist)
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "Release tag $RELEASE_TAG does not match bundle version v$version." >&2
            exit 1
          fi

          archive="MacFlow-$version-universal.zip"
          checksum="$archive.sha256"
          {
            echo "version=$version"
            echo "archive=$archive"
            echo "checksum=$checksum"
          } >> "$GITHUB_OUTPUT"

      - name: Notarize and staple app
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          for value in NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_APP_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "Required notarization secret is missing: $value" >&2
              exit 1
            fi
          done

          notary_archive="$RUNNER_TEMP/macflow-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/MacFlow.app "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --wait
          xcrun stapler staple build/MacFlow.app
          xcrun stapler validate build/MacFlow.app
          codesign --verify --deep --strict build/MacFlow.app
          spctl --assess --type execute build/MacFlow.app

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MACFLOW_KEYCHAIN_PATH:-}" ]]; then
            security lock-keychain "$MACFLOW_KEYCHAIN_PATH" || true
            security delete-keychain "$MACFLOW_KEYCHAIN_PATH" || true
          fi
          {
            echo "MACFLOW_SIGN_IDENTITY="
            echo "MACFLOW_KEYCHAIN_PATH="
          } >> "$GITHUB_ENV"

      - name: Create archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.release.outputs.archive }}"
          ditto -c -k --sequesterRsrc --keepParent build/MacFlow.app "$archive"
          unzip -t "$archive"
          shasum -a 256 "$archive" > "${{ steps.release.outputs.checksum }}"

      - name: Upload verified release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-package
          path: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: macos-15
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write

    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-package
          path: dist

      - name: Publish release from verified artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          archive="dist/${{ needs.package.outputs.archive }}"
          checksum="dist/${{ needs.package.outputs.checksum }}"
          args=(release create "$RELEASE_TAG" "$archive" "$checksum"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "MacFlow ${{ needs.package.outputs.version }}"
            --generate-notes
            --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
